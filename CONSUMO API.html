<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball API - Personajes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    .character-card {
      transition: transform 0.2s;
    }
    .character-card:hover {
      transform: translateY(-5px);
    }
    .character-img {
      height: 280px;
      object-fit: contain;
      background: radial-gradient(circle, #fff3cd 0%, #ffeeba 100%);
      padding: 15px;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5">
    <h1 class="text-center mb-4 text-danger font-weight-bold" style="text-shadow: 2px 2px #ffc107;">🐉 Dragon Ball API - Buscador 🐉</h1>
    
    <!--Barra de búsqueda-->
    <div class="row justify-content-center mb-4">
      <div class="col-md-6">
        <input type="text" id="search-input" class="form-control form-control-lg shadow-sm" placeholder="Busca un personaje (ej. Goku, Vegeta, Bills)...">
      </div>
    </div>

    <!--Loader-->
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-danger" role="status" style="width: 3rem; height: 3rem;">
        <span class="sr-only">Cargando...</span>
      </div>
      <p class="mt-2 text-muted">Invocando personajes de las Esferas del Dragón...</p>
    </div>

    <!--Contenedor donde se mostrarán las tarjetas-->
    <div id="characters-container" class="row"></div>
  </div>

  <script>
    // Endpoint principal de la API de Dragon Ball
    const API_URL = 'https://dragonball-api.com/api/characters?limit=50';
    let allCharacters = [];

    async function fetchCharacters() {
      const container = document.getElementById('characters-container');
      const loading = document.getElementById('loading');

      try {
        const response = await fetch(API_URL);
        
        if (!response.ok) {
          throw new Error(`Error en la petición: ${response.status}`);
        }

        const data = await response.json();
        
        // La API devuelve los resultados en una propiedad 'items' o directamente como array
        allCharacters = Array.isArray(data) ? data : (data.items || []);
        
        loading.style.display = 'none';
        displayCharacters(allCharacters);

      } catch (error) {
        console.error('Error al obtener los datos:', error);
        loading.innerHTML = `
          <div class="alert alert-danger text-center" role="alert">
            Hubo un problema al conectar con la API de Dragon Ball. Inténtalo más tarde.
          </div>
        `;
      }
    }

    function displayCharacters(charactersList) {
      const container = document.getElementById('characters-container');
      container.innerHTML = '';

      if (charactersList.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center">
            <p class="text-muted font-italic">No se encontró ningún guerrero Z con ese nombre.</p>
          </div>
        `;
        return;
      }

      charactersList.forEach(character => {
        const col = document.createElement('div');
        col.className = 'col-12 col-sm-6 col-md-4 col-lg-3 mb-4';

        const name = character.name || 'Desconocido';
        const race = character.race || 'Desconocida';
        const ki = character.ki || 'N/A';
        const image = character.image || 'https://via.placeholder.com/300x300?text=Sin+Imagen';

        col.innerHTML = `
          <div class="card character-card h-100 shadow-sm border-0 text-center">
            <img src="${image}" class="card-img-top character-img" alt="${name}">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title font-weight-bold text-dark">${name}</h5>
              <p class="card-text text-muted small mb-2"><strong>Raza:</strong> ${race}</p>
              <p class="card-text text-danger small font-weight-bold mt-auto">Ki: ${ki}</p>
            </div>
          </div>
        `;

        container.appendChild(col);
      });
    }

    // Buscador en tiempo real
    document.getElementById('search-input').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();
      
      const filtered = allCharacters.filter(character => {
        const name = (character.name || '').toLowerCase();
        return name.includes(searchTerm);
      });

      displayCharacters(filtered);
    });

    // Cargar al iniciar la página
    fetchCharacters();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
